<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<title>X79 MD5 Master Template</title>
<link rel="stylesheet" href="styles.css?v=final-md5-1">
</head>
<body>
<main id="app" class="app-shell">
  <section id="lobby" class="screen lobby-screen active" aria-label="Sảnh chính X79">
    <div class="stage stage-3x2 lobby-stage">
      <img class="master-art" src="assets/lobby-final.png" alt="Sảnh chính X79" draggable="false">
      <span id="openXocDiaMd5" class="touch-zone lobby-xd" role="button" tabindex="0" aria-label="Mở Xóc Đĩa MD5"></span>
      <span id="openTaiXiuMd5" class="touch-zone lobby-tx" role="button" tabindex="0" aria-label="Mở Tài Xỉu MD5"></span>
    </div>
  </section>

  <section id="gameOverlay" class="game-overlay" aria-hidden="true">
    <div class="overlay-dim" aria-hidden="true"></div>
    <div id="gameStage" class="stage stage-3x2 game-stage">
      <img id="gameArt" class="master-art" alt="Bàn cược X79 MD5" draggable="false">
      <div id="md5Label" class="md5-label" aria-live="polite"></div>
      <span id="betLeft" class="touch-zone bet-zone bet-left" role="button" tabindex="0"></span>
      <span id="betRight" class="touch-zone bet-zone bet-right" role="button" tabindex="0"></span>
      <span id="betSub1" class="touch-zone bet-zone sub sub1" role="button" tabindex="0"></span>
      <span id="betSub2" class="touch-zone bet-zone sub sub2" role="button" tabindex="0"></span>
      <span id="betSub3" class="touch-zone bet-zone sub sub3" role="button" tabindex="0"></span>
      <span id="betSub4" class="touch-zone bet-zone sub sub4" role="button" tabindex="0"></span>
      <span class="touch-zone chip-zone chip1" data-chip="10000" role="button" tabindex="0" aria-label="Chip 10K"></span>
      <span class="touch-zone chip-zone chip2" data-chip="50000" role="button" tabindex="0" aria-label="Chip 50K"></span>
      <span class="touch-zone chip-zone chip3" data-chip="100000" role="button" tabindex="0" aria-label="Chip 100K"></span>
      <span class="touch-zone chip-zone chip4" data-chip="500000" role="button" tabindex="0" aria-label="Chip 500K"></span>
      <span class="touch-zone chip-zone chip5" data-chip="1000000" role="button" tabindex="0" aria-label="Chip 1M"></span>
      <span id="cancelBet" class="touch-zone common-action cancel-action" role="button" tabindex="0" aria-label="Hủy cược"></span>
      <span id="repeatBet" class="touch-zone common-action repeat-action" role="button" tabindex="0" aria-label="Đặt lại"></span>
      <span id="confirmBet" class="touch-zone common-action confirm-action" role="button" tabindex="0" aria-label="Xác nhận cược"></span>
      <span id="soundToggle" class="touch-zone sound-action" role="button" tabindex="0" aria-label="Âm thanh"></span>
      <span id="closeGame" class="touch-zone close-action" role="button" tabindex="0" aria-label="Đóng game"></span>
      <div id="chipGlow" class="chip-glow" aria-hidden="true"></div>
      <div id="motionFx" class="motion-fx" aria-hidden="true"></div>
    </div>
  </section>
</main>
<script src="app.js?v=final-md5-1"></script>
</body>
</html>
