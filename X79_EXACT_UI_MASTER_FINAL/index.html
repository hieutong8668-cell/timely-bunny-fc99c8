<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#020b12" />
  <title>X79</title>
  <link rel="preload" href="assets/x79-master.png" as="image" />
  <link rel="stylesheet" href="styles.css?v=20260811-exact1" />
</head>
<body>
  <main id="app" class="app" aria-label="X79">
    <section id="uiScreen" class="screen active">
      <div id="stage" class="stage">
        <img class="master" src="assets/x79-master.png" width="1536" height="1024" alt="X79" draggable="false" />

        <!-- Auth buttons: exact coordinates from the master artwork -->
        <button class="hotspot auth login" data-auth="login" aria-label="Đăng nhập"></button>
        <button class="hotspot auth register" data-auth="register" aria-label="Đăng ký"></button>

        <!-- Header actions -->
        <button class="hotspot head exchange" data-action="QUY ĐỔI" aria-label="Quy đổi"></button>
        <button class="hotspot head mail" data-action="HỘP THƯ" aria-label="Hộp thư"></button>
        <button class="hotspot head event" data-action="SỰ KIỆN" aria-label="Sự kiện"></button>
        <button class="hotspot head mission" data-action="NHIỆM VỤ" aria-label="Nhiệm vụ"></button>
        <button class="hotspot head settings" data-action="CÀI ĐẶT" aria-label="Cài đặt"></button>

        <!-- Categories -->
        <button class="hotspot cat c-all" data-action="TẤT CẢ" aria-label="Tất cả"></button>
        <button class="hotspot cat c-hot" data-action="HOT" aria-label="Hot"></button>
        <button class="hotspot cat c-card" data-action="GAME BÀI" aria-label="Game bài"></button>
        <button class="hotspot cat c-live" data-action="SÒNG BÀI" aria-label="Sòng bài"></button>
        <button class="hotspot cat c-slot" data-action="QUAY HŨ" aria-label="Quay hũ"></button>
        <button class="hotspot cat c-fish" data-action="BẮN CÁ" aria-label="Bắn cá"></button>
        <button class="hotspot cat c-electronic" data-action="ĐIỆN TỬ" aria-label="Điện tử"></button>
        <button class="hotspot cat c-lottery" data-action="XỔ SỐ" aria-label="Xổ số"></button>
        <button class="hotspot cat c-mini" data-action="MINI GAME" aria-label="Mini game"></button>

        <!-- Game cards -->
        <button class="hotspot game g-xd" data-action="XÓC ĐĨA" aria-label="Xóc đĩa"></button>
        <button class="hotspot game g-xd5" data-action="XÓC ĐĨA MD5" aria-label="Xóc đĩa MD5"></button>
        <button class="hotspot game g-tx" data-action="TÀI XỈU" aria-label="Tài xỉu"></button>
        <button class="hotspot game g-tx5" data-action="TÀI XỈU MD5" aria-label="Tài xỉu MD5"></button>
        <button class="hotspot game g-fish" data-action="BẮN CÁ" aria-label="Bắn cá"></button>
        <button class="hotspot game g-slot" data-action="NỔ HŨ" aria-label="Nổ hũ"></button>
        <button class="hotspot game g-poker" data-action="POKER" aria-label="Poker"></button>
        <button class="hotspot game g-bj" data-action="BLACKJACK" aria-label="Blackjack"></button>

        <!-- Live tables -->
        <button class="hotspot table t-xd" data-action="XÓC ĐĨA LIVE" aria-label="Xóc đĩa live"></button>
        <button class="hotspot table t-xd5" data-action="XÓC ĐĨA MD5 LIVE" aria-label="Xóc đĩa MD5 live"></button>
        <button class="hotspot table t-tx" data-action="TÀI XỈU LIVE" aria-label="Tài xỉu live"></button>
        <button class="hotspot table t-tx5" data-action="TÀI XỈU MD5 LIVE" aria-label="Tài xỉu MD5 live"></button>
        <button class="hotspot table b-bac" data-action="BACCARAT" aria-label="Baccarat"></button>
        <button class="hotspot table b-rou" data-action="ROULETTE" aria-label="Roulette"></button>
        <button class="hotspot table b-slot" data-action="NỔ HŨ" aria-label="Nổ hũ"></button>
        <button class="hotspot table b-fish" data-action="BẮN CÁ" aria-label="Bắn cá"></button>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section id="connectScreen" class="connect-screen" aria-label="Đang kết nối">
      <div class="connect-panel">
        <div class="connect-logo">X79</div>
        <div class="connect-title">ĐANG KẾT NỐI ĐẾN HỆ THỐNG</div>
        <div id="connectPct" class="connect-pct">0%</div>
        <div class="connect-track"><i id="connectBar"></i></div>
        <div id="connectText" class="connect-text">Đang xác thực tài khoản...</div>
      </div>
    </section>

    <div id="authModal" class="modal" aria-hidden="true">
      <div class="auth-card">
        <button id="authClose" class="modal-close" type="button" aria-label="Đóng">×</button>
        <div class="auth-logo">X79</div>
        <div class="tabs">
          <button class="tab active" data-tab="login">ĐĂNG NHẬP</button>
          <button class="tab" data-tab="register">ĐĂNG KÝ</button>
        </div>
        <form id="loginForm" class="form active" data-form="login">
          <label>Tên đăng nhập<input name="username" autocomplete="username" minlength="3" required /></label>
          <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" minlength="6" required /></label>
          <button class="primary" type="submit">ĐĂNG NHẬP</button>
        </form>
        <form id="registerForm" class="form" data-form="register">
          <label>Tên đăng nhập<input name="username" minlength="3" required /></label>
          <label>Mật khẩu<input name="password" type="password" minlength="6" required /></label>
          <label>Nhập lại mật khẩu<input name="confirm" type="password" minlength="6" required /></label>
          <label>Mã giới thiệu <small>(nếu có)</small><input name="referral" /></label>
          <button class="primary" type="submit">ĐĂNG KÝ</button>
        </form>
        <div id="authMsg" class="auth-msg"></div>
      </div>
    </div>
  </main>
  <script src="app.js?v=20260811-exact1"></script>
</body>
</html>
